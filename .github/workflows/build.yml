name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: swift build -c release
      
      - uses: actions/upload-artifact@v4
        with:
          name: App
          path: .build/release/SystemMonitor
